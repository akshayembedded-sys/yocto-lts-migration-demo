# SPDX-License-Identifier: MIT
# Lint only. Full Yocto builds stay local: one build needs tens of GB of disk and about an hour
# on 32 CPUs (docs/RESULTS.md), far beyond a hosted runner.
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # same image and version as the local runs
      - run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x scripts/*.sh

  oelint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install oelint-adv==9.11.3
      # main holds the Wrynose layer. Info notes are hidden: they suggest optional variables
      # (CVE_PRODUCT, BBCLASSEXTEND, and BUGTRACKER/SECTION on the image), none useful here.
      - run: >-
          find meta-demo \( -name '*.bb' -o -name '*.bbappend' \)
          -exec oelint-adv --quiet --hide info --release wrynose {} +
