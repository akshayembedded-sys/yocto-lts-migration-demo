# SPDX-License-Identifier: MIT
# Demo product distro. It started in Kirkstone-era style (PLAN.md); docs/MIGRATION_LOG.md has each change.
require conf/distro/poky.conf

DISTRO = "demo"
DISTRO_NAME = "Demo industrial distro"
DISTRO_VERSION = "1.0"

# systemd through INIT_MANAGER; its include also adds usrmerge (Scarthgap)
INIT_MANAGER = "systemd"

# CVE scanning: the core/yocto/sbom-cve-check fragment, enabled per build (kas/wrynose.yml)

# FIT kernel image, built by the linux-yocto-fitimage recipe (Wrynose). The kernel
# itself keeps the machine's KERNEL_IMAGETYPE, which runqemu boots directly.
KERNEL_CLASSES += "kernel-fit-extra-artifacts"
KERNEL_DEPLOY_DEPEND = "linux-yocto-fitimage:do_deploy"
UBOOT_LOADADDRESS = "0x40080000"
UBOOT_ENTRYPOINT = "0x40080000"
