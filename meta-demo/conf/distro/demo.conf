# Demo product distro, written in Kirkstone-era style on purpose (see PLAN.md).
require conf/distro/poky.conf

DISTRO = "demo"
DISTRO_NAME = "Demo industrial distro"
DISTRO_VERSION = "1.0"

# systemd through INIT_MANAGER; its include also adds usrmerge (Scarthgap)
INIT_MANAGER = "systemd"

# CVE scanning, Kirkstone way
INHERIT += "cve-check"

# FIT kernel image, Kirkstone way
KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPE = "fitImage"
UBOOT_LOADADDRESS = "0x40080000"
UBOOT_ENTRYPOINT = "0x40080000"

# runqemu has no U-Boot, so it still boots the plain Image
KERNEL_IMAGETYPES += "Image"
QB_DEFAULT_KERNEL = "Image"
